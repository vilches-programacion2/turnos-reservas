services:
  reservas-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-reservas}
      POSTGRES_USER: ${DB_USER:-reservas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - reservas-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [reservas]

  reservas:
    build: .
    environment:
      DB_URL: jdbc:postgresql://reservas-db:5432/${DB_NAME:-reservas}
      DB_USER: ${DB_USER:-reservas}
      DB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:8080"
    depends_on:
      reservas-db:
        condition: service_healthy
    networks: [reservas]

volumes:
  reservas-data:

networks:
  reservas:

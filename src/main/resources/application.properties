spring.application.name=turnos-reservas
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.jwt.issuer=${JWT_ISSUER:https://turnos-reservas.local}
app.jwt.audience=${JWT_AUDIENCE:turnos-reservas}
app.jwt.catalog-audience=${JWT_CATALOG_AUDIENCE:turnos-catalogo}
app.jwt.time-to-live=${JWT_TIME_TO_LIVE:30m}
app.jwt.private-key=${JWT_PRIVATE_KEY}
app.jwt.public-key=${JWT_PUBLIC_KEY}

app.catalogo.base-url=${CATALOGO_BASE_URL:}
app.catalogo.audience=${app.jwt.catalog-audience}
app.catalogo.connect-timeout=${CATALOGO_CONNECT_TIMEOUT:3s}
app.catalogo.read-timeout=${CATALOGO_READ_TIMEOUT:5s}

app.catedra.enabled=${CATEDRA_ENABLED:false}
app.catedra.base-url=${CATEDRA_BASE_URL:}
app.catedra.token-file=${CATEDRA_TOKEN_FILE:}
app.catedra.connect-timeout=${CATEDRA_CONNECT_TIMEOUT:3s}
app.catedra.read-timeout=${CATEDRA_READ_TIMEOUT:5s}
app.catedra.kafka.security-protocol=${CATEDRA_KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
app.catedra.kafka.request-timeout=${CATEDRA_KAFKA_REQUEST_TIMEOUT:5s}
app.catedra.kafka.operation-timeout=${CATEDRA_KAFKA_OPERATION_TIMEOUT:10s}
app.catedra.kafka.retry-backoff=${CATEDRA_KAFKA_RETRY_BACKOFF:250ms}
app.catedra.kafka.retries=${CATEDRA_KAFKA_RETRIES:2}
app.reservas.recuperacion.intervalo=${RESERVAS_RECUPERACION_INTERVALO:60s}

# No volcar propiedades de clientes Kafka; pueden incluir configuración sensible.
logging.level.org.apache.kafka.clients.admin.AdminClientConfig=WARN
logging.level.org.apache.kafka.clients.producer.ProducerConfig=WARN
logging.level.org.apache.kafka.clients.consumer.ConsumerConfig=WARN

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState

# Se habilitará al implementar y proteger los contratos HTTP de negocio.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

logging.level.root=INFO
logging.level.reservas=${APP_LOG_LEVEL:INFO}
server.error.include-message=never
server.error.include-stacktrace=never
